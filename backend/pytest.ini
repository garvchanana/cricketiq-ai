[pytest]
# Phase 10.1 — pytest configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers (also registered in conftest.py for IDE support)
markers =
    requires_db: test requires a live MySQL connection
    requires_llm: test requires a live Groq API call
    slow: test takes more than a few seconds to run