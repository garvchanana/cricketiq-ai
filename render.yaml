# Phase 12.2 (final) — Render deployment configuration
# Uses SQLite (committed to repo) — no external database needed

services:
  - type: web
    name: cricketiq-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: USE_SQLITE
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /